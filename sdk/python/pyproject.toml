[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-sandbox"
dynamic = ["version"]
description = "Python SDK for agent-sandbox: isolated, network-controlled code execution for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []  # standard library only
authors = [{ name = "farvez" }]
keywords = ["ai", "agents", "sandbox", "code-execution", "gvisor", "llm", "tools", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.optional-dependencies]
# MCP server for Claude Code, Claude Desktop and other MCP clients (needs Python 3.10+).
mcp = ["mcp>=2.3,<3; python_version >= '3.10'"]

[project.scripts]
airlock-sandbox-mcp = "airlock_sandbox.mcp_server:main"
airlock-sandbox-keys = "airlock_sandbox.keys:main"

[project.urls]
Homepage = "https://github.com/farvez/agent-sandbox"
Source = "https://github.com/farvez/agent-sandbox/tree/main/sdk/python"
Issues = "https://github.com/farvez/agent-sandbox/issues"

[tool.setuptools.dynamic]
version = { attr = "airlock_sandbox.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airlock_sandbox = ["py.typed"]
