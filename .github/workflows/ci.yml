name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Linux, real containers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build sandbox image
        run: docker build -t sandbox-base:latest .

      # So tests/test_sdk_typescript.py can run the TypeScript SDK against the API.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build

      # Runs everything, including the Docker tests (network/OOM/timeout/read-only
      # root, egress through the proxy) and the symlink-escape tests that are
      # skipped on Windows. -rs lists anything that still skipped.
      - name: Run tests
        run: pytest -q -rs

  sdk-typescript:
    name: TypeScript SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]   # oldest supported and current
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build, unit tests, type check
        run: npm ci && npm test
      - name: Check the published contents
        run: npm pack --dry-run

  sdk:
    name: SDK wheel (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]   # oldest supported and newest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build and check metadata
        run: |
          pip install build twine
          python -m build sdk/python
          twine check sdk/python/dist/*

      # Tests the built wheel, not the source tree: catches missing modules and
      # syntax newer than the oldest supported Python.
      - name: Install wheel and run offline tests
        run: |
          # The [mcp] extra installs only on Python 3.10+ (an environment marker); on 3.9 the MCP test skips.
          pip install "$(ls sdk/python/dist/*.whl)[mcp]" pytest
          cd sdk/python
          python -c "import airlock_sandbox, sys; assert 'site-packages' in airlock_sandbox.__file__, airlock_sandbox.__file__"
          pytest -q tests -p no:cacheprovider

  terraform:
    name: Terraform (fmt, validate, render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # templatefile() fails on any unescaped ${...}; render the boot script with
      # sample values and syntax-check the result with bash. Rendered in an empty
      # directory: `terraform console` here would demand the S3 backend, which CI
      # (rightly) has no credentials for.
      - name: Render and syntax-check user_data.sh
        run: |
          render_dir=$(mktemp -d)
          cp user_data.sh "$render_dir/"
          cd "$render_dir"
          echo 'templatefile("user_data.sh", {aws_region="us-east-1", bundle_param="/agent-sandbox/app-bundle", api_key_param="/agent-sandbox/api-keys", domain_name="", session_ttl_secs=1800, egress_policy_json=jsonencode({default=["pypi"]}), workspaces_disk_gb=15, workspace_slots=100, workspace_quota_mb=512, tenant_limits_json=jsonencode({}), public_ip="203.0.113.10", admin_key_param="/agent-sandbox/admin-key", keys_table="agent-sandbox-api-keys", accounts_table="agent-sandbox-console", console_base_url="https://airlock.example.com", github_client_id="Iv1.example", github_secret_param="/agent-sandbox/github-client-secret", console_secret_param="/agent-sandbox/console-secret", console_admins="farvez", console_signup="invite", console_contact="", tls_state_s3="s3://bucket/tls/caddy", acme_email="ops@example.com", audit_table="agent-sandbox-audit", audit_retention_days=90, notify_topic_arn="arn:aws:sns:us-east-1:123456789012:alerts"})' \
            | terraform console > rendered.txt
          sed -n '2,/^EOT/p' rendered.txt | sed '$d' > user_data.rendered.sh
          bash -n user_data.rendered.sh
          grep -q 'WS_SLOTS="100"' user_data.rendered.sh
