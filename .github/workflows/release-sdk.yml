name: Release SDK

# Publishes sdk/python to PyPI when a tag like sdk-v0.1.0 is pushed:
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
# Run it manually (Actions → Release SDK → Run workflow) to publish to TestPyPI first.
#
# Uses PyPI trusted publishing — no API token is stored anywhere. One-time setup on
# pypi.org (and test.pypi.org): Account → Publishing → add a pending publisher for
# project "agent-sandbox-sdk", owner "farvez", repository "agent-sandbox",
# workflow "release-sdk.yml", environment "pypi" (TestPyPI: "testpypi").

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('sdk/python/src/agent_sandbox/__init__.py').read()).group(1))")
          if [ "sdk-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"; exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build sdk/python
          twine check sdk/python/dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
